<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    width: 340px;
    margin: 0;
    padding: 14px;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 13px;
    color: #22251f;
    background: #f8f8f6;
  }
  h1 { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
  label { display: block; font-size: 12px; color: #565951; margin: 10px 0 4px; }
  select, textarea, button {
    width: 100%;
    box-sizing: border-box;
    font: inherit;
    border: 1px solid #d5d4cd;
    border-radius: 6px;
    padding: 6px 8px;
  }
  textarea { resize: vertical; min-height: 90px; }
  button {
    margin-top: 8px;
    background: #477055;
    color: #fff;
    border-color: transparent;
    cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary { background: transparent; color: #477055; border-color: #d5d4cd; }
  #status, #autofill-status { margin-top: 8px; font-size: 12px; color: #78776f; }
  #status.error, #autofill-status.error { color: #9c3a2c; }
  hr { border: 0; border-top: 1px solid #e5e4df; margin: 14px 0; }
</style>
</head>
<body>
  <h1>Dynamic Resume</h1>

  <label for="resume-select">Resume</label>
  <select id="resume-select" disabled></select>

  <button id="grab-btn" disabled>Grab job description</button>
  <button id="selection-btn" class="secondary" disabled style="display:none;">Use selected text instead</button>

  <label for="jd-text">Captured text (check it before continuing)</label>
  <textarea id="jd-text" placeholder="Checking this page…"></textarea>

  <label for="tailoring-instructions">Tailoring preferences (optional)</label>
  <textarea id="tailoring-instructions" maxlength="1000" placeholder="E.g. Emphasize customer-facing solution design. Only truthful resume edits."></textarea>

  <button id="generate-btn" disabled>Generate tailored resume</button>

  <p id="status"></p>

  <hr>

  <button id="autofill-btn" class="secondary" disabled>Autofill name/email/phone on this page</button>
  <p id="autofill-status"></p>

  <script type="module" src="popup.js"></script>
</body>
</html>
